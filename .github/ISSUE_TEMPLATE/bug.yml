name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open /en/blog\n2. ..."
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL or request ID
      description: The `requestId` from an RFC 9457 problem response helps a lot.
  - type: input
    id: env
    attributes:
      label: Browser, OS or environment
