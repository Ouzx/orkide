name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Turborepo Remote Cache. Both are optional: without them Turbo simply runs uncached.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check
      # Catalog and dependency-range consistency across the workspace.
      - run: pnpm exec sherif
      # Knip resolves imports of the generated Paraglide output, so compile it first.
      - run: pnpm --filter @orkide/i18n build
      # Unused files, dependencies and unlisted imports (see knip.json for what is switched off).
      - run: pnpm exec knip

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

  # The browser jobs below serve the production build locally (Miniflare, same Service Binding as
  # in production) against a throwaway D1 database. `ENVIRONMENT=development` switches the API's
  # per-IP rate limits off: every request here shares one IP.
  e2e:
    name: E2E and accessibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/local-stack
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/local-stack
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Lighthouse CI
        run: |
          export CHROME_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          pnpm lighthouse
        working-directory: apps/web
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci
          retention-days: 7

  size:
    name: Bundle size
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm size
