packages:
  - apps/*
  - packages/*

# Single source of truth for every external dependency version.
# Packages reference these with `catalog:`; strict mode rejects anything else on `pnpm add`.
catalogMode: strict
catalog:
  "@commitlint/cli": ^21.2.3
  "@commitlint/config-conventional": ^21.2.3
  "@commitlint/config-pnpm-scopes": ^21.2.2
  "@shadcn/lint": ^0.2.0
  "@types/node": ^24.19.0
  commitizen: ^4.3.2
  cz-git: ^1.14.0
  lefthook: ^2.1.15
  lint-staged: ^17.6.0
  oxfmt: ^0.71.0
  oxlint-plugin-react-doctor: ^0.9.14
  oxlint-tsgolint: ^7.0.2003
  oxlint: ^1.86.0
  turbo: ^2.11.5
  typescript: ^7.0.2
  ultracite: ^7.12.2
  "@inlang/paraglide-js": ^2.25.4
  pino: ^10.3.1
  pino-pretty: ^13.1.3
  vitest: ^4.1.11
  drizzle-orm: 1.0.0-rc.4
  uuid: ^14.0.2
  zod: ^4.6.5
  "@cloudflare/workers-types": ^5.20260930.2
  drizzle-kit: 1.0.0-rc.4
  "@better-auth/drizzle-adapter": ^1.7.6
  "@better-auth/passkey": ^1.7.6
  better-auth: ^1.7.6
  auth: ^1.7.6
  "@types/react": ^19.3.0
  react: ^19.3.0
  "@hono/zod-openapi": ^1.6.3
  "@scalar/hono-api-reference": ^0.12.7
  file-type: ^22.1.1
  hono: ^4.13.12
  resend: ^6.31.0
  "@cloudflare/vite-plugin": ^1.62.2
  vite: ^8.3.1
  wrangler: ^4.144.0
  "@cloudflare/vitest-plugin": ^1.3.3
  "@tiptap/core": ^3.31.3
  "@tiptap/extension-image": ^3.31.3
  "@tiptap/pm": ^3.31.3
  "@tiptap/starter-kit": ^3.31.3
  "@tiptap/static-renderer": ^3.31.3

# Dependencies trusted to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true
